name: invite

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: invite-${{ github.event.comment.user.login }}

jobs:
  invite:
    if: contains(github.event.issue.labels.*.name, 'access') && github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      TARGET: b0nduel/daic-brand
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      LOGIN: ${{ github.event.comment.user.login }}
      BODY: ${{ github.event.comment.body }}
      CODE: ${{ secrets.JOIN_CODE }}
    steps:
      - name: Check code word
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          code = os.environ["CODE"].strip().lower()
          body = os.environ["BODY"].lower()
          print("ok=" + ("true" if code and code in body else "false"))
          PY

      - name: Hide comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"

      - name: Invite
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.INVITE_TOKEN }}
        run: gh api -X PUT "repos/$TARGET/collaborators/$LOGIN" -f permission=push --silent

      - name: Reply (invited)
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE" --body "@$LOGIN приглашение отправлено. Примите его: https://github.com/$TARGET/invitations
          Дальше — инструкция в README: https://github.com/$GH_REPO#readme"

      - name: Reply (wrong code)
        if: steps.check.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE" --body "@$LOGIN кодовое слово не подошло. Уточните его у того, кто дал ссылку, и напишите комментарий ещё раз."
